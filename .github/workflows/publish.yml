name: Publish to npm

# 触发：推送形如 v0.1.0 / v0.2.0 的 tag 时自动发布
# 用法：本地 `npm version patch && git push --follow-tags`，其余交给本工作流
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write   # OIDC（Trusted Publishing）必需，用于生成 OIDC 令牌
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 24   # Node 24 自带 npm 11（OIDC/Trusted Publishing 需 npm >= 11.5.1）
          registry-url: 'https://registry.npmjs.org'

      # 安全阀：tag 版本必须与 package.json 的 version 一致，避免忘 bump 就发版
      - name: Verify tag matches package version
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json version = $PKG, tag = $TAG"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag ($TAG) 与 package.json version ($PKG) 不一致，已中止发布"
            exit 1
          fi

      # Trusted Publishing (OIDC)：npm 自动用 OIDC 认证，无需任何长期 token
      - name: Publish (Trusted Publishing / OIDC)
        run: npm publish --access public
